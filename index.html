<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV Dawntrail Mount Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #ffd700; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
        .card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ffd700; }
        input { width: 100%; padding: 10px; border: none; border-radius: 6px; background: rgba(255,255,255,0.2); color: #fff; }
        input::placeholder { color: #aaa; }
        button { background: #ffd700; color: #1a1a2e; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: transform 0.2s; margin-right: 8px; }
        button:hover { transform: scale(1.05); }
        .btn-danger { background: #e74c3c; color: #fff; }
        .mount-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
        .mount-card { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; border-left: 4px solid #ffd700; }
        .mount-card.coming-soon { border-left-color: #666; opacity: 0.6; }
        .mount-card h3 { color: #ffd700; margin-bottom: 8px; font-size: 13px; }
        .mount-card.coming-soon h3 { color: #888; }
        .mount-name { font-size: 11px; color: #aaa; }
        .progress-bar { background: rgba(255,255,255,0.2); border-radius: 10px; height: 14px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); transition: width 0.3s; }
        .checkbox-group { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }
        .checkbox-group input { width: auto; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(255,215,0,0.2); color: #ffd700; font-size: 11px; }
        th:first-child, td:first-child { text-align: left; }
        .got-mount { color: #2ecc71; }
        .clickable { cursor: pointer; }
        .clickable:hover { color: #ffd700; }
        .coming-soon-badge { background: #444; color: #aaa; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .analysis { margin-top: 20px; }
        .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .analysis-card { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; }
        .analysis-card h3 { color: #ffd700; margin-bottom: 12px; font-size: 14px; }
        .priority-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .priority-high { color: #e74c3c; }
        .priority-med { color: #f39c12; }
        .priority-low { color: #2ecc71; }
        .status-bar { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .status-label { width: 120px; font-size: 12px; }
        .status-track { flex: 1; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .status-fill { height: 100%; background: #2ecc71; transition: width 0.3s; }
        .status-fill.needs { background: #e74c3c; }
        .status-count { width: 60px; text-align: right; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 Dawntrail Mount Tracker</h1>
        <p class="subtitle">Extreme Trial Mounts - Static Tracker</p>

        <div class="card">
            <h2>Enter / Update Your Data</h2>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="playerName" placeholder="e.g. Warrior of Light">
            </div>
            <div class="mount-grid" id="mountGrid"></div>
            <br>
            <button onclick="saveData()">💾 Save</button>
            <button class="btn-danger" onclick="deleteMe()">🗑️ Delete My Data</button>
        </div>

        <div class="card">
            <h2>📋 Static Overview</h2>
            <div class="table-wrapper">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="membersList"></tbody>
                </table>
            </div>
        </div>

        <div class="card analysis">
            <h2>📊 Farm Priority Analysis</h2>
            <div class="analysis-grid">
                <div class="analysis-card">
                    <h3>🎯 Most Needed Mounts</h3>
                    <div id="mostNeeded"></div>
                </div>
                <div class="analysis-card">
                    <h3>📈 Completion Status</h3>
                    <div id="completionStatus"></div>
                </div>
                <div class="analysis-card">
                    <h3>🔥 Farm Recommendations</h3>
                    <div id="recommendations"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ============================================
        // DEINE FIREBASE CONFIG (bereits eingetragen!)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyANYJcKALE4skWvP70_qNOE5yyYhry94A0",
            authDomain: "static-tracker.firebaseapp.com",
            databaseURL: "https://static-tracker-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "static-tracker",
            storageBucket: "static-tracker.firebasestorage.app",
            messagingSenderId: "335007041159",
            appId: "1:335007041159:web:7232ab4ef409499b815a22"
        };
        // ============================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MOUNTS = [
            { trial: 'Valigarmanda', zone: 'Worqor Lar Dor', mount: 'Wings of Ruin', icon: '🦅', released: true },
            { trial: 'Zoraal Ja', zone: 'Everkeep', mount: 'Wings of Resolve', icon: '⚔️', released: true },
            { trial: 'Sphene', zone: "Minstrel's Ballad", mount: 'Wings of Eternity', icon: '👑', released: true },
            { trial: 'Zelenia', zone: 'TBD', mount: 'Wings of the Knighthood', icon: '🌸', released: true },
            { trial: 'Necron', zone: 'TBD', mount: 'Wings of Death', icon: '💀', released: true },
            { trial: 'Doomtrain', zone: 'TBD', mount: 'Wings of Mist', icon: '🚂', released: true },
            { trial: 'Enou', zone: 'Patch 7.5', mount: 'TBD', icon: '🔮', released: false }
        ];

        let allData = {};

        function getData() {
            return allData;
        }

        function saveToStorage(data) {
            db.ref('mounts').set(data);
        }

        function initData() {
            db.ref('mounts').on('value', (snapshot) => {
                allData = snapshot.val() || {};
                renderList();
                renderAnalysis();
            });
        }

        function renderMountGrid() {
            const grid = document.getElementById('mountGrid');
            grid.innerHTML = MOUNTS.map((m, i) => `
                <div class="mount-card ${!m.released ? 'coming-soon' : ''}">
                    <h3>${m.icon} ${m.trial}</h3>
                    <div class="mount-name">${m.mount}</div>
                    ${m.released ? `
                        <label style="font-size:12px">Tokens</label>
                        <input type="number" id="tokens${i}" min="0" max="99" value="0" onchange="updateProgress(${i})">
                        <div class="progress-bar"><div class="progress-fill" id="prog${i}" style="width:0%"></div></div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="mount${i}">
                            <label for="mount${i}">Mount obtained</label>
                        </div>
                    ` : `<p style="margin-top:10px"><span class="coming-soon-badge">Patch 7.5</span></p>`}
                </div>
            `).join('');
        }

        function updateProgress(i) {
            const val = document.getElementById(`tokens${i}`).value;
            document.getElementById(`prog${i}`).style.width = `${(val/99)*100}%`;
        }

        function saveData() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) { alert('Please enter your name!'); return; }
            
            const data = getData();
            data[name] = {
                mounts: MOUNTS.map((m, i) => {
                    if (!m.released) return { tokens: 0, has: false };
                    return {
                        tokens: parseInt(document.getElementById(`tokens${i}`).value) || 0,
                        has: document.getElementById(`mount${i}`).checked
                    };
                })
            };
            saveToStorage(data);
            alert('Saved!');
        }

        function loadPlayer(name) {
            const data = getData();
            if (data[name]) {
                document.getElementById('playerName').value = name;
                data[name].mounts.forEach((m, i) => {
                    if (MOUNTS[i].released) {
                        document.getElementById(`tokens${i}`).value = m.tokens || 0;
                        document.getElementById(`mount${i}`).checked = m.has || false;
                        updateProgress(i);
                    }
                });
            }
        }

        function deleteMe() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return;
            if (confirm(`Delete "${name}"?`)) {
                const data = getData();
                delete data[name];
                saveToStorage(data);
            }
        }

        function renderList() {
            const data = getData();
            
            document.getElementById('tableHead').innerHTML = `
                <tr>
                    <th>Name</th>
                    ${MOUNTS.map(m => `<th>${m.icon}<br>${m.trial}</th>`).join('')}
                </tr>
            `;
            
            const list = document.getElementById('membersList');
            list.innerHTML = Object.entries(data).map(([name, info]) => `
                <tr>
                    <td class="clickable" onclick="loadPlayer('${name}')">${name}</td>
                    ${(info.mounts || []).map((m, i) => `
                        <td class="${m && m.has ? 'got-mount' : ''}">
                            ${!MOUNTS[i].released ? '-' : (m && m.has ? '✅' : `${(m && m.tokens) || 0}/99`)}
                        </td>
                    `).join('')}
                </tr>
            `).join('');
        }

        function renderAnalysis() {
            const data = getData();
            const players = Object.entries(data);
            const totalPlayers = players.length;

            if (totalPlayers === 0) {
                document.getElementById('mostNeeded').innerHTML = '<p style="color:#888">No data yet</p>';
                document.getElementById('completionStatus').innerHTML = '<p style="color:#888">No data yet</p>';
                document.getElementById('recommendations').innerHTML = '<p style="color:#888">No data yet</p>';
                return;
            }

            const mountStats = MOUNTS.filter(m => m.released).map((mount, i) => {
                let need = 0;
                let totalTokens = 0;
                players.forEach(([name, info]) => {
                    const m = info.mounts && info.mounts[i];
                    if (!m || !m.has) {
                        need++;
                        totalTokens += (m && m.tokens) || 0;
                    }
                });
                return { ...mount, index: i, need, have: totalPlayers - need, avgTokens: need > 0 ? Math.round(totalTokens / need) : 0 };
            });

            const sorted = [...mountStats].sort((a, b) => b.need - a.need);
            document.getElementById('mostNeeded').innerHTML = sorted.map(m => `
                <div class="priority-item">
                    <span>${m.icon} ${m.trial}</span>
                    <span class="${m.need > totalPlayers/2 ? 'priority-high' : m.need > 0 ? 'priority-med' : 'priority-low'}">${m.need}/${totalPlayers} need it</span>
                </div>
            `).join('');

            document.getElementById('completionStatus').innerHTML = mountStats.map(m => {
                const pct = (m.have / totalPlayers) * 100;
                return `<div class="status-bar"><span class="status-label">${m.icon} ${m.trial}</span><div class="status-track"><div class="status-fill" style="width:${pct}%"></div></div><span class="status-count">${m.have}/${totalPlayers}</span></div>`;
            }).join('');

            const recs = sorted.filter(m => m.need > 0).slice(0, 3);
            document.getElementById('recommendations').innerHTML = recs.length > 0 ? `
                <p style="margin-bottom:10px">Focus on these trials:</p>
                ${recs.map((m, idx) => `<div class="priority-item"><span><strong>#${idx+1}</strong> ${m.icon} ${m.trial}</span><span>${m.need} players need, avg ${m.avgTokens} tokens</span></div>`).join('')}
                <p style="margin-top:15px;color:#aaa;font-size:12px">💡 Tip: Farm ${recs[0].trial} first - most people still need it!</p>
            ` : '<p style="color:#2ecc71">🎉 Everyone has all mounts!</p>';
        }

        renderMountGrid();
        initData();
    </script>
</body>
</html>
